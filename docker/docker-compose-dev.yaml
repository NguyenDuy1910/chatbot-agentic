volumes:
  data:
  qdrant_storage:

networks:
  finx:
    driver: bridge

services:
  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: finx-qdrant
    pull_policy: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - finx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database (optional, for testing)
  postgres:
    image: postgres:14-alpine
    container_name: finx-postgres
    platform: linux/amd64
    ports:
      - "9432:5432"
    volumes:
      - data:/var/lib/postgresql/data
      - ../finx-engine/docker/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_PASSWORD=admin 
      - POSTGRES_USER=admin
      - POSTGRES_DB=vikki
      - PGDATA=/var/lib/postgresql/data/pgdata
    networks:
      - finx
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d vikki"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - postgres

