version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: finx-postgres
    environment:
      POSTGRES_DB: sample_db
      POSTGRES_USER: finx_user
      POSTGRES_PASSWORD: finx_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finx_user -d sample_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: finx-api
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - CORS_ORIGINS=http://localhost:3000
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./api:/app/api
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  ui:
    build:
      context: ./web-ui
      dockerfile: ../docker/Dockerfile.ui
    container_name: finx-ui
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:

